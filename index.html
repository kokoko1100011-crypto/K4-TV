<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K4 TV - البث المباشر والقنوات الرياضية</title>
    <!-- استدعاء Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء مكتبة HLS لدعم تشغيل روابط m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #050505;
            color: #f4f4f5;
        }
        .glow-red {
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.25);
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-red-600 selection:text-white">

    <!-- رأس الصفحة -->
    <header class="bg-black border-b border-red-600/40 p-4 sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="showHomeView()">
                <div class="w-10 h-10 bg-gradient-to-br from-red-600 to-red-900 rounded-xl flex items-center justify-center font-black text-xl tracking-wider glow-red border border-red-500/50">
                    K4
                </div>
                <div>
                    <h1 class="text-xl font-black text-white tracking-wider glow-text">
                        K4 <span class="text-red-600">TV</span>
                    </h1>
                    <p class="text-[10px] text-zinc-400 tracking-widest uppercase">IPTV Sports Hub</p>
                </div>
            </div>

            <nav class="flex items-center gap-3">
                <button onclick="showHomeView()" class="text-xs font-semibold bg-red-600/10 hover:bg-red-600 text-red-500 hover:text-white px-3 py-1.5 rounded-lg border border-red-600/30 transition-all duration-300">
                    القنوات الرياضية
                </button>
            </nav>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="p-4 max-w-3xl mx-auto flex-grow w-full">
        
        <!-- قسم قائمة القنوات (الرئيسية) -->
        <div id="home-view" class="space-y-4">
            <div class="flex justify-between items-center bg-zinc-900/60 p-3 rounded-xl border border-zinc-900">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 bg-red-600 rounded-full animate-ping"></span>
                    <h2 class="text-sm font-bold text-zinc-200 tracking-wide">قنوات البث المباشر (IPTV)</h2>
                </div>
                <span class="text-xs text-red-500 font-semibold bg-red-600/10 px-2.5 py-1 rounded-lg border border-red-600/20">بث عالي الجودة</span>
            </div>

            <!-- حاوية القنوات (يمكنك إضافة أو تعديل الروابط هنا) -->
            <div id="channels-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                
                <!-- قناة 1 -->
                <div onclick="openStreamPlayer('beIN Sports 1 HD', 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')" class="bg-zinc-900/80 border border-zinc-800 hover:border-red-600 transition-all duration-300 rounded-2xl p-4 flex justify-between items-center shadow-lg cursor-pointer group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-zinc-800 rounded-xl flex items-center justify-center font-bold text-red-500 border border-zinc-700 group-hover:border-red-600 transition">
                            1
                        </div>
                        <div>
                            <span class="font-bold text-sm block group-hover:text-red-500 transition">beIN Sports 1</span>
                            <span class="text-[10px] text-zinc-500 block">بث مباشر 24 ساعة</span>
                        </div>
                    </div>
                    <span class="text-xs bg-red-600/20 text-red-500 px-2.5 py-1 rounded-lg border border-red-600/30">شغل الآن ◄</span>
                </div>

                <!-- قناة 2 -->
                <div onclick="openStreamPlayer('beIN Sports 2 HD', 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')" class="bg-zinc-900/80 border border-zinc-800 hover:border-red-600 transition-all duration-300 rounded-2xl p-4 flex justify-between items-center shadow-lg cursor-pointer group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-zinc-800 rounded-xl flex items-center justify-center font-bold text-red-500 border border-zinc-700 group-hover:border-red-600 transition">
                            2
                        </div>
                        <div>
                            <span class="font-bold text-sm block group-hover:text-red-500 transition">beIN Sports 2</span>
                            <span class="text-[10px] text-zinc-500 block">بث مباشر 24 ساعة</span>
                        </div>
                    </div>
                    <span class="text-xs bg-red-600/20 text-red-500 px-2.5 py-1 rounded-lg border border-red-600/30">شغل الآن ◄</span>
                </div>

            </div>

            <div class="text-center text-[11px] text-zinc-500 mt-2 bg-zinc-900/40 p-2.5 rounded-xl border border-zinc-900">
                💡 انقر على أي قناة لفتح مشغل البث المباشر الخاص بها فوراً.
            </div>
        </div>

        <!-- قسم مشغل الفيديو الحصري -->
        <div id="player-view" class="hidden space-y-4">
            <button onclick="showHomeView()" class="bg-zinc-900 hover:bg-zinc-800 text-xs font-semibold px-4 py-2 rounded-xl transition border border-zinc-800 flex items-center gap-2 text-zinc-300 hover:text-white">
                ← العودة إلى قائمة القنوات
            </button>

            <div class="bg-gradient-to-r from-zinc-900 via-black to-zinc-900 border border-red-600/30 p-3.5 rounded-2xl text-center glow-red">
                <h3 id="channel-title-display" class="font-bold text-red-500 text-base">جارٍ تحميل البث...</h3>
            </div>

            <!-- مشغل البث النظيف -->
            <div class="relative bg-black rounded-2xl overflow-hidden border border-zinc-900 shadow-2xl aspect-video flex items-center justify-center glow-red">
                <video id="video-player" controls autoplay class="w-full h-full object-contain"></video>
            </div>
        </div>

    </main>

    <!-- تذييل الموقع بحقوقك الخاصة -->
    <footer class="bg-black border-t border-zinc-900 text-center py-4 text-xs text-zinc-500 mt-auto">
        جميع الحقوق محفوظة &copy; 2026 - <span class="text-red-500 font-bold">K4 TV</span> | تصميم وتطوير كرار
    </footer>

    <!-- سكربت التشغيل وتدفق القنوات -->
    <script>
        let hlsInstance = null;

        function openStreamPlayer(channelName, streamUrl) {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('player-view').classList.remove('hidden');
            document.getElementById('channel-title-display').innerText = channelName;

            const video = document.getElementById('video-player');

            if (hlsInstance) {
                hlsInstance.destroy();
            }

            if (Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        function showHomeView() {
            document.getElementById('player-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');

            const video = document.getElementById('video-player');
            video.pause();
            video.src = "";
            if (hlsInstance) {
                hlsInstance.destroy();
            }
        }
    </script>
</body>
</html>
