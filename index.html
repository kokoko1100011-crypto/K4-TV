<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K4 TV - المنصة الرياضية الشاملة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for IPTV Streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: Tahoma, sans-serif; }
        .red-glow { box-shadow: 0 0 15px rgba(220, 38, 38, 0.6); }
    </style>
</head>
<body class="bg-black min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-zinc-900 border-b border-red-600 p-4 text-center sticky top-0 z-50 red-glow">
        <h1 class="text-3xl font-black text-red-600 tracking-wider">K4 TV</h1>
        <p class="text-xs text-zinc-400 mt-1">البث المباشر والمباريات الحصرية</p>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-4 flex-grow max-w-4xl">

        <!-- Video Player Section -->
        <div class="mb-8 bg-zinc-900 rounded-xl overflow-hidden border border-red-800 red-glow">
            <div class="relative bg-black aspect-video flex items-center justify-center">
                <video id="video" controls autoplay class="w-full h-full object-contain"></video>
                <div id="player-placeholder" class="absolute text-zinc-500 text-sm">اختر قناة أو مباراة للبدء بالمشاهدة</div>
            </div>
            <div class="p-3 bg-zinc-950 text-center font-bold text-red-500" id="current-channel-name">
                اختر قناة من القائمة أدناه
            </div>
        </div>

        <!-- Encrypted & Sport Channels -->
        <section class="mb-8">
            <h2 class="text-xl font-bold text-red-600 mb-4 border-r-4 border-red-600 pr-2">القنوات المشفرة والرياضية</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <button onclick="playStream('https://stream.example.com/bein1/index.m3u8', 'BeIN Sports 1 HD')" class="bg-zinc-900 hover:bg-red-700 border border-zinc-800 hover:border-red-500 p-3 rounded-lg text-center transition font-semibold text-sm flex flex-col items-center justify-center">
                    <span class="text-red-500 font-bold mb-1">🔴 مشفرة</span> BeIN Sports 1
                </button>
                <button onclick="playStream('https://stream.example.com/bein2/index.m3u8', 'BeIN Sports 2 HD')" class="bg-zinc-900 hover:bg-red-700 border border-zinc-800 hover:border-red-500 p-3 rounded-lg text-center transition font-semibold text-sm flex flex-col items-center justify-center">
                    <span class="text-red-500 font-bold mb-1">🔴 مشفرة</span> BeIN Sports 2
                </button>
                <button onclick="playStream('https://stream.example.com/ssc1/index.m3u8', 'SSC 1 HD')" class="bg-zinc-900 hover:bg-red-700 border border-zinc-800 hover:border-red-500 p-3 rounded-lg text-center transition font-semibold text-sm flex flex-col items-center justify-center">
                    <span class="text-red-500 font-bold mb-1">⭐ ناقل حصري</span> SSC 1 HD
                </button>
                <button onclick="playStream('https://stream.example.com/alkass1/index.m3u8', 'الكأس 1 HD')" class="bg-zinc-900 hover:bg-red-700 border border-zinc-800 hover:border-red-500 p-3 rounded-lg text-center transition font-semibold text-sm flex flex-col items-center justify-center">
                    <span class="text-red-500 font-bold mb-1">📺 رياضية</span> قنوات الكأس 1
                </button>
            </div>
        </section>

        <!-- Matches Schedule Section -->
        <section>
            <h2 class="text-xl font-bold text-red-600 mb-4 border-r-4 border-red-600 pr-2">مباريات اليوم (تحديث تلقائي)</h2>
            <div id="matches-container" class="space-y-3">
                <!-- سيتم تعبئة المباريات تلقائياً عبر الـ API المبرمج أدناه -->
                <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-center text-zinc-400 text-sm">
                    جاري جلب جدول المباريات اليومية...
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-zinc-950 border-t border-zinc-900 text-center py-4 text-xs text-zinc-500">
        Designed by Karrar &copy; 2026 K4 TV
    </footer>

    <!-- Script Logic & Hidden API Integration -->
    <script>
        // إخفاء وحفظ المفتاح داخل نطاق مغلق (Closure) لئلا يظهر بسهولة
        (function() {
            const K4_CONFIG = {
                apiKey: "9a1a6171f57a300f82ffc5b7fb7a6250",
                endpoint: "https://v3.football.api-sports.io/fixtures?live=all" // مثال لرابط جلب المباريات المباشرة
            };

            // دالة جلب المباريات تلقائياً باستخدام مفتاحك السري
            window.fetchLiveMatches = async function() {
                try {
                    const response = await fetch(K4_CONFIG.endpoint, {
                        method: "GET",
                        headers: {
                            "x-apisports-key": K4_CONFIG.apiKey
                        }
                    });
                    const result = await response.json();
                    
                    // هنا يمكنك معالجة البيانات وعرضها في الحاوية matches-container
                    console.log("تم جلب البيانات بنجاح:", result);
                } catch (error) {
                    console.error("خطأ في الاتصال بالـ API:", error);
                }
            };
        })();

        // تشغيل دالة الجلب فور تحميل الصفحة
        window.onload = function() {
            if (typeof window.fetchLiveMatches === 'function') {
                window.fetchLiveMatches();
            }
        };

        // مشغل البث المباشر HLS
        function playStream(url, channelName) {
            var video = document.getElementById('video');
            var placeholder = document.getElementById('player-placeholder');
            var nameDisplay = document.getElementById('current-channel-name');
            
            nameDisplay.innerText = "جاري تشغيل: " + channelName;
            placeholder.style.display = 'none';

            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }
    </script>
</body>
</html>
